name: HPM cloud cron

on:
  schedule:
    # 高频：每 10 分钟（用于尽快验证）
    - cron: '*/10 * * * *'
    # 低频对照：每天 UTC 18:00（北京时间 02:00），用于验证高频是否被调度器丢弃
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hpm-cloud-cron
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger HPM cloud refresh test
        env:
          HPM_TOKEN: ${{ vars.HPM_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          echo "UTC: $(date -u --iso-8601=seconds)"
          echo "schedule: ${{ github.event.schedule }}"
          status=$(curl -sS -o /tmp/body.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${HPM_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "User-Agent: hpm-cloud-cron" \
            https://api.github.com/repos/sundance0216/hpm-refresh-test/actions/workflows/refresh-test.yml/dispatches \
            -d '{"ref":"main"}')
          echo "HTTP ${status}"
          cat /tmp/body.txt || true
          test "${status}" = "204"
